<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Cliche Checker</title>
  </head>
  <body>
    <main>
      <h1>Cliche Checker</h1>

      <label for="hashtag">Hashtag</label>
      <input id="hashtag" type="text" placeholder="productivity" autocomplete="off" />

      <label for="draft">Your draft</label>
      <textarea id="draft" rows="5" maxlength="280" placeholder="Paste your post draft here..."></textarea>

      <button id="grade" type="button">Grade</button>

      <section id="results" class="hidden" aria-live="polite">
        <div class="score">
          <strong id="score-value">--</strong><span>/100 originality</span>
        </div>
        <dl>
          <div><dt>Verdict</dt><dd id="verdict-value">--</dd></div>
          <div><dt>Confidence</dt><dd id="confidence-value">--</dd></div>
          <div><dt>Looks saturated</dt><dd id="saturated-value">--</dd></div>
          <div><dt>Jev time</dt><dd id="latency-value">--</dd></div>
        </dl>
      </section>

      <p id="status" class="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
